<!doctype html>
<html lang="en-AU">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b5cff">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <title>Mattershot</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header>
    <h1>Mattershot</h1>
    <p class="tag">Back up and digitise physical Matter codes</p>
  </header>

  <main>
    <section class="card">
      <button id="scanBtn" class="btn primary big">Scan QR code</button>
      <div id="scanArea" hidden>
        <video id="video" playsinline muted autoplay></video>
        <button id="cancelScan" class="btn ghost">Cancel</button>
      </div>
      <p class="subtle">
        <label class="linklike">photo / image<input id="fileInput" type="file" accept="image/*" capture="environment" hidden></label>
        <span class="dot" aria-hidden="true">&middot;</span>
        <button id="pasteBtn" class="linklike" type="button">enter code manually</button>
      </p>
      <p id="scanMsg" class="msg" hidden></p>
    </section>

    <section class="card" id="result" hidden>
      <div class="labelwrap"><img id="labelImg" alt="Matter label preview"></div>

      <div class="field">
        <label for="product">Product</label>
        <input id="product" type="text" placeholder="e.g. Eve Energy" autocomplete="off">
      </div>
      <div class="field">
        <label for="location">Location <span class="opt">(optional)</span></label>
        <input id="location" type="text" placeholder="e.g. Kitchen" autocomplete="off" autocapitalize="words">
      </div>
      <div class="field">
        <label for="itemNumber">Item Number <span class="opt">(optional)</span></label>
        <div class="stepper">
          <button type="button" class="step" id="numMinus" aria-label="Decrease item number">&minus;</button>
          <input id="itemNumber" type="number" min="0" step="1" inputmode="numeric" placeholder="&mdash;">
          <button type="button" class="step" id="numPlus" aria-label="Increase item number">+</button>
        </div>
      </div>

      <div class="row">
        <button id="dlPng" class="btn primary" type="button">Save PNG</button>
        <button id="dlSvg" class="btn primary" type="button">Save SVG</button>
      </div>
    </section>
  </main>

  <script src="vendor/jsQR.js"></script>
  <script src="vendor/qrcode.js"></script>
  <script type="module" src="app.js"></script>
</body>
</html>
